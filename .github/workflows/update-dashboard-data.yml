name: Update dashboard data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate manifest
        run: python dashboard/scripts/generate-input-manifest.py

      - name: Fetch QQQ OHLC cache
        run: python dashboard/scripts/fetch-qqq-ohlc.py
        continue-on-error: true

      - name: Commit if changed
        run: |
          if git diff --quiet -- dashboard/manifest.json dashboard/qqq-ohlc.json; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/manifest.json dashboard/qqq-ohlc.json
          git commit -m "chore: refresh dashboard manifest and QQQ OHLC cache"
          git push
